spring:
  application:
    name: spacestudyship
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  mvc:
    hiddenmethod:
      filter:
        enabled: true

  # Flyway (공통)
  flyway:
    enabled: true
    baseline-on-migrate: true
    # 기존 비어있지 않은 DB(Hibernate가 생성)에서 baseline 기본값(1)이 0.0.x 마이그레이션을
    # 건너뛰는 것을 방지 — 0으로 두어 0.0.31~ 모든 마이그레이션이 적용되게 한다.
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: false

server:
  port: 8080

# Swagger (공통)
springdoc:
  swagger-ui:
    path: /docs/swagger
    display-request-duration: true
    persist-authorization: true
    filter: true
  api-docs:
    path: /docs/api-docs
  packages-to-scan: com.elipair.spacestudyship
  paths-to-match: /api/**

# Actuator (공통)
management:
  endpoints:
    web:
      exposure:
        include: health

# Firebase Admin SDK
firebase:
  admin-sdk-path: classpath:firebase/spacestudyship-firebase-adminsdk-fbsvc-7e86c5c253.json
